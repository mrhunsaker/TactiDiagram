name: Desktop packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    name: Validate tag and derive the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Validate and stamp the calendar version
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]{4}\\.[0-9]+\\.[0-9]+$'; then
            echo "::error::Tag ${TAG} does not match the required vYYYY.M.D format (for example v2026.11.22)."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} as version ${TAG#v}"

  linux:
    name: Linux AppImage
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Rasterize the app icon
        run: |
          for c in convert magick; do
            if command -v "$c" >/dev/null 2>&1; then
              "$c" -background none -density 300 packaging/icon.svg -resize 256x256 packaging/icon.png
              exit 0
            fi
          done
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -background none -density 300 packaging/icon.svg -resize 256x256 packaging/icon.png

      - name: Download Neutralino binaries
        run: npx neu update
        working-directory: desktop/neutralino

      - name: Build AppImage
        run: node scripts/package.mjs --target linux --version "${{ needs.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchSight-NG-linux-x86_64
          path: dist/TouchSight-NG-x86_64.AppImage

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TouchSight-NG-x86_64.AppImage

  windows:
    name: Windows package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save sharp png-to-ico rcedit

      - name: Download Neutralino binaries
        run: npx neu update
        working-directory: desktop/neutralino

      - name: Build icon assets (png + ico)
        run: node scripts/win-icon.cjs

      - name: Build Windows package
        run: node scripts/package.mjs --target win --version "${{ needs.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchSight-NG-win-x64
          path: dist/TouchSight-NG-win-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TouchSight-NG-win-x64.zip

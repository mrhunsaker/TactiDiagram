name: Desktop packaging

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'scripts/package.mjs'
      - 'scripts/win-icon.cjs'
      - 'desktop/neutralino/**'
      - 'packaging/**'
      - '.github/workflows/desktop-packaging.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/desktop-gui.md'
      - 'docs/getting-started.md'

permissions:
  contents: write

jobs:
  validate:
    name: Validate packaging sources
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax and package versions
        run: |
          node --check scripts/package.mjs
          node --check scripts/win-icon.cjs
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); const l=JSON.parse(fs.readFileSync('package-lock.json')); if (p.version !== l.version || p.version !== l.packages[''].version) process.exit(1)"
      - name: Build documentation
        run: |
          python -m pip install -r requirements-docs.txt
          mkdocs build --site-dir _site

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: v
        name: Validate tag and package metadata
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]{4}\\.[0-9]+\\.[0-9]+$'; then
            echo "::error::Tag must match vYYYY.M.D."
            exit 1
          fi
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) must match tag version ($VERSION)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    if: github.event_name == 'push'
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rasterize app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -background none -density 300 packaging/icon.svg -resize 256x256 packaging/icon.png
      - run: npx neu update
        working-directory: desktop/neutralino
      - run: node scripts/package.mjs --target linux --version "${{ needs.version.outputs.version }}"
        name: Build Linux AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: TouchSight-NG-linux-x86_64
          path: dist/TouchSight-NG-x86_64.AppImage
          if-no-files-found: error

  windows:
    if: github.event_name == 'push'
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save sharp png-to-ico rcedit
      - run: npx neu update
        working-directory: desktop/neutralino
      - run: node scripts/win-icon.cjs
        name: Build Windows icon assets
      - run: node scripts/package.mjs --target win --version "${{ needs.version.outputs.version }}"
        name: Build Windows ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: TouchSight-NG-win-x64
          path: dist/TouchSight-NG-win-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Attach both artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/TouchSight-NG-linux-x86_64/TouchSight-NG-x86_64.AppImage
            release-assets/TouchSight-NG-win-x64/TouchSight-NG-win-x64.zip
